# 개발용 MySQL 하나만 띄웁니다.
#
# API 서버는 Docker 로 만들지 않습니다. `dotnet run` 으로 실행합니다.
# 코드를 고칠 때마다 이미지를 다시 만들 필요가 없고, 디버거를 붙이기도 쉽습니다.
#
# 실행 방법은 README.md 를 보세요.

# 폴더 이름("server")이 아니라 이 이름으로 컨테이너 · 볼륨 · 네트워크가 묶입니다.
name: araatti

services:
  mysql:
    image: mysql:8.4
    container_name: araatti-mysql
    restart: unless-stopped

    environment:
      # :? 는 "값이 없으면 실행을 멈추고 이 메시지를 보여준다" 는 뜻입니다.
      # .env 를 만들지 않고 실행했을 때 원인을 바로 알 수 있습니다.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in server/.env (copy from .env.example)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-araatti}
      MYSQL_USER: ${MYSQL_USER:-araatti}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in server/.env (copy from .env.example)}

    # ⚠ 기본값이 127.0.0.1 인 것은 실수가 아닙니다.
    #
    # Docker 는 포트를 열 때 iptables 규칙을 직접 넣습니다. 그 규칙은 UFW 보다
    # 먼저 걸리기 때문에, 방화벽이 3306 을 막고 있어도 바깥에서 DB 에 그대로
    # 닿습니다. 서버에 올렸을 때 아무도 눈치채지 못한 채 DB 가 인터넷에 열립니다.
    #
    # 127.0.0.1 로 묶으면 같은 machine 안에서만 보입니다. API 서버는 어차피
    # 같은 machine 에서 도니 이것으로 충분합니다.
    #
    # 다른 PC 에서 이 DB 에 붙어야 할 때만 .env 에 MYSQL_BIND=0.0.0.0 을 적습니다.
    ports:
      - "${MYSQL_BIND:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"

    # 한글 이름을 저장하므로 utf8mb4 를 못박아 둡니다.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      # 이름 있는 볼륨이라 컨테이너를 지워도 데이터가 남습니다.
      # 데이터까지 완전히 지우려면: docker compose down -v
      - araatti-mysql-data:/var/lib/mysql

    healthcheck:
      # $$ 는 compose 가 아니라 컨테이너 안 셸이 풀어야 하는 변수라는 표시입니다.
      # 덕분에 비밀번호가 compose 설정에 문자열로 남지 않습니다.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  araatti-mysql-data:
