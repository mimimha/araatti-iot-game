# 아라아띠 — 홈페이지 · 클라이언트 zip 다운로드 (nginx)
#
#   sudo cp nginx-araatti.conf /etc/nginx/sites-available/araatti.conf
#   sudo ln -sf /etc/nginx/sites-available/araatti.conf /etc/nginx/sites-enabled/araatti.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 도메인이 있으면 server_name 을 araatti.site www.araatti.site 로 바꾸고
# `sudo certbot --nginx -d araatti.site -d www.araatti.site` 를 돌린다. 443 과 80 → 443 은 certbot 이 넣는다.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/araatti;
    index index.html;
    charset utf-8;
    sendfile on;
    tcp_nopush on;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /AraAtti.zip {
        add_header Content-Disposition 'attachment; filename="AraAtti.zip"';
        add_header Cache-Control "public, max-age=3600";
    }

    access_log /var/log/nginx/araatti.access.log;
    error_log  /var/log/nginx/araatti.error.log;
}
