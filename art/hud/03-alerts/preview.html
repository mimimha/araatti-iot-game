<!doctype html><html lang="ko"><meta charset="utf-8"><title>HUD 03 · Alerts</title>
<style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#193340;color:#f5f1df;font:16px system-ui,sans-serif}h1{font-size:25px}p{color:#b7cbd3}.stack{width:min(640px,100%);display:grid;gap:12px;margin:30px 0}.card{position:relative;aspect-ratio:4/1}.layer{position:absolute;inset:0;width:100%;height:100%}.accent{position:absolute;left:2.5%;top:11.67%;width:2.5%;height:76.67%}.slot{position:absolute;left:6.25%;top:10%;width:20%;height:80%}.icon{position:absolute;left:7.92%;top:16.67%;width:16.67%;height:66.67%;object-fit:contain}.title{position:absolute;left:29.17%;top:15%;font-size:clamp(13px,3.4vw,25px);font-weight:850}.detail{position:absolute;left:29.17%;top:43%;font-size:clamp(11px,2.7vw,20px);color:#cedbdd}.timer{position:absolute;left:29.17%;top:78.33%;width:66.67%;height:6.67%}.timer img{position:absolute;inset:0;width:100%;height:100%}.controls{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:24px}label{display:grid;gap:8px}select,input,button{padding:8px;border:1px solid #6d8796;border-radius:5px;background:#284656;color:#fff}.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.tile{padding:12px;background:#254451;border-radius:10px}.checker{height:140px;display:grid;place-items:center;background:repeating-conic-gradient(#607780 0% 25%,#8a9da4 0% 50%) 0/20px 20px}.checker img{max-width:100%;max-height:135px}.tile a{display:block;color:#d0f2ff;font-size:13px;margin-top:10px;overflow-wrap:anywhere}</style>
<h1>03 · 사건 알림</h1><p>아이콘·제목·설명·남은 시간·새 알림 강조를 독립적으로 바꾸는 미리보기입니다.</p>
<div class="controls"><label>첫 카드 사건<select id="kind"><option value="hull">선체 파손</option><option value="sail">돛 손상</option><option value="cannon">대포 고장</option></select></label><label>남은 시간 비율 <output id="value">72%</output><input id="remaining" type="range" min="0" max="100" value="72"></label><label>새 알림 강조<input id="highlight" type="checkbox" checked></label><button id="play">카운트다운 재생</button></div>
<div class="stack" id="stack"></div><h2>개별 PNG · 10종</h2><div class="assets" id="assets"></div>
<script>
const data={hull:['icon-hull-breach','HULL BREACH','Repair the hull'],sail:['icon-sail-torn','SAIL TORN','Patch the sail'],cannon:['icon-cannon-jam','CANNON JAM','Clear the barrel']};
const stack=document.getElementById('stack');['hull','sail','cannon'].forEach((kind,i)=>{const d=document.createElement('div');d.className='card';const [icon,title,detail]=data[kind];d.innerHTML=`<img class="layer" src="alert-background.png"><img class="layer" src="alert-frame.png"><img class="accent" src="alert-accent-red.png"><img class="slot" src="alert-icon-slot.png"><img class="icon" src="${icon}.png"><span class="title">${title}</span><span class="detail">${detail}</span><div class="timer"><img src="alert-countdown-track.png"><img class="fill" src="alert-countdown-fill.png" style="clip-path:inset(0 ${[28,47,65][i]}% 0 0)"></div><img class="layer highlight" src="alert-new-highlight.png" style="display:${i===0?'block':'none'}">`;stack.append(d)});
const first=stack.firstElementChild,remaining=document.getElementById('remaining');function update(){const [icon,title,detail]=data[document.getElementById('kind').value];first.querySelector('.icon').src=icon+'.png';first.querySelector('.title').textContent=title;first.querySelector('.detail').textContent=detail;const ratio=+remaining.value;first.querySelector('.fill').style.clipPath=`inset(0 ${100-ratio}% 0 0)`;first.querySelector('.fill').style.display=ratio===0?'none':'block';first.querySelector('.highlight').style.display=document.getElementById('highlight').checked?'block':'none';document.getElementById('value').textContent=ratio+'%'}
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',update));let timer=null;const play=document.getElementById('play');play.onclick=()=>{if(timer){clearInterval(timer);timer=null;play.textContent='카운트다운 재생';return}if(+remaining.value===0)remaining.value=100;play.textContent='일시 정지';timer=setInterval(()=>{remaining.value=Math.max(0,+remaining.value-1);update();if(+remaining.value===0){clearInterval(timer);timer=null;play.textContent='카운트다운 재생'}},100)};
const names=['alert-background','alert-frame','alert-accent-red','alert-new-highlight','alert-icon-slot','alert-countdown-track','alert-countdown-fill','icon-hull-breach','icon-sail-torn','icon-cannon-jam'];names.forEach(n=>{const d=document.createElement('div');d.className='tile';d.innerHTML=`<div class="checker"><img src="${n}.png"></div><a href="${n}.png" download>${n}.png</a><a href="${n}.svg" download>SVG 원본</a>`;document.getElementById('assets').append(d)});update();
</script></html>
