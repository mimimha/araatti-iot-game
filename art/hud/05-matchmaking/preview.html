<!doctype html><html lang="ko"><meta charset="utf-8"><title>팀 매칭 · 빈 UI 에셋</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#142c3a;color:#f6e6bf;font:16px system-ui,sans-serif}.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:url(harbour-background.png) center/cover no-repeat}.shade{position:absolute;inset:0;background:#0b263312}.panel{position:absolute;left:8%;top:2.5%;width:84%;aspect-ratio:1578/997}.panelArt{position:absolute;inset:0;width:100%;height:100%}.spinner{position:absolute;left:24%;top:12.5%;width:4.4%;aspect-ratio:1;animation:spin 1.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.heading{position:absolute;left:30%;right:10%;top:12.5%;height:8%;display:flex;align-items:center;font-size:clamp(15px,2.8vw,48px);font-weight:850;color:#ffedc3;text-shadow:0 2px 3px #081b2a}.subtitle{position:absolute;top:22%;left:10%;right:10%;text-align:center;font-size:clamp(10px,1.4vw,24px);color:#c6baa2}.slots{position:absolute;left:13%;right:13%;top:26%;display:grid;grid-template-columns:repeat(4,1fr);gap:4.4%}.slot{position:relative;aspect-ratio:2/3}.slot img{position:absolute;inset:0;width:100%;height:100%}.slot .nameplate{inset:auto 5% 3%;width:90%;height:15.83%}.slot .nickname{position:absolute;left:7%;right:7%;bottom:4%;height:14%;display:grid;place-items:center;font-size:clamp(10px,1.5vw,26px);font-weight:800;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#cfccb6}.slot.occupied .nickname{color:#4b3517}.notice{position:absolute;top:74%;left:10%;right:10%;height:5%;text-align:center;font-size:clamp(10px,1.4vw,25px);font-weight:700;color:#e4bd72}.divider{position:absolute;left:30%;top:74%;width:40%;height:3.1%}.cancel{position:absolute;left:38%;top:79%;width:24%;aspect-ratio:512/112;border:0;background:url(match-button-normal.png) center/100% 100% no-repeat;color:#55320c;font:800 clamp(12px,1.7vw,29px) system-ui;cursor:pointer}.cancel:active{background-image:url(match-button-pressed.png)}.cancel:disabled{background-image:url(match-button-disabled.png);cursor:default}.controls{padding:24px 32px;display:flex;flex-wrap:wrap;gap:24px;align-items:center}label{display:flex;align-items:center;gap:12px}input,select{accent-color:#ffc44a}p{margin:0;padding:0 32px 24px;color:#b7c8cc}.assets{padding:0 32px 32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.tile{padding:12px;background:#25414f;border-radius:8px}.checker{height:150px;display:grid;place-items:center;background:repeating-conic-gradient(#647c84 0% 25%,#9badb2 0% 50%) 0/20px 20px}.checker img{max-width:100%;max-height:140px}.tile a{display:block;color:#d0efff;font-size:13px;margin-top:10px;overflow-wrap:anywhere}.capture .controls,.capture p,.capture .assets{display:none}.capture .stage{width:100vw;height:100vh;aspect-ratio:auto}.capture .spinner{animation:none}
.slot .placeholder{inset:3% 5% 17%;width:90%;height:80%;object-fit:contain;filter:brightness(.65)}.slot .question{position:absolute;left:0;right:0;top:24%;height:40%;display:grid;place-items:center;color:#849393;font-family:Arial,sans-serif;font-weight:800;font-size:clamp(48px,7vw,116px);line-height:1}.slot.occupied .placeholder,.slot.occupied .question{display:none}.slot .placeholder{inset:4% 11% auto;width:78%;height:77%;object-fit:fill;filter:brightness(.85)}.slot .question{inset:28% 34% auto;width:32%;height:34%;object-fit:fill}.slot:not(.occupied) .nameplate{left:5%;width:90%;height:15.83%;bottom:3%}.slot:not(.occupied) .nickname{left:7%;right:7%;bottom:4%;height:14%}</style>
<style>.panel{aspect-ratio:1729/1093}</style>
<div class="stage"><div class="shade"></div><div class="panel"><img class="panelArt" src="match-panel.png"><img class="spinner" src="loading-spinner.png"><div class="heading"></div><div class="subtitle"></div><div class="slots" id="slots"></div><img class="divider" src="notice-divider.png"><div class="notice"></div><button class="cancel" aria-label="매칭 취소"></button></div></div>
<div class="controls"><label>현재 인원 <input id="count" type="range" min="0" max="4" value="1"><output id="countText">1 / 4</output></label><label><input id="sampleText" type="checkbox">예시 텍스트 표시 (에셋에는 미포함)</label><label>버튼 상태<select id="buttonState"><option value="normal">기본</option><option value="pressed">눌림</option><option value="disabled">비활성</option></select></label></div>
<p>빈 대기열의 실루엣은 별도 이미지입니다. 둥근 물음표는 별도 이미지, 매칭 상태는 UI 텍스트이며 입장 시 숨겨집니다. 실제 캐릭터와 닉네임은 에셋에 포함하지 않았습니다. 실제 캐릭터 모델/RenderTexture는 각 카드 중앙의 빈 공간에 연결하세요. 이 화면은 매칭 서버에 연결되지 않은 조합 미리보기입니다.</p>
<div class="assets" id="assets"></div>
<script>
const $=id=>document.getElementById(id);for(let i=0;i<4;i++){const d=document.createElement('div');d.className='slot';d.innerHTML='<img class="back"><img class="placeholder" src="slot-waiting-silhouette.png"><img class="question" src="slot-question-mark.png"><img src="slot-frame.png"><img class="local" src="slot-local-highlight.png"><img class="nameplate"><span class="nickname"></span>';$('slots').append(d)}
function update(){const n=+$('count').value,show=$('sampleText').checked;$('countText').textContent=n+' / 4';document.querySelectorAll('.slot').forEach((s,i)=>{const occupied=i<n;s.classList.toggle('occupied',occupied);s.querySelector('.back').src=occupied?'slot-occupied-background.png':'slot-empty-background.png';s.querySelector('.local').style.display=i===0&&occupied?'block':'none';s.querySelector('.nameplate').src=occupied?'slot-nameplate-light.png':'slot-nameplate-dark.png';s.querySelector('.nickname').textContent=occupied?(show?(i===0?'나':'플레이어 '+(i+1)):''):'매칭 중…'});document.querySelector('.heading').textContent=show?(n===4?'팀 구성이 완료됐어요':'지금 매칭 중입니다'):'';document.querySelector('.subtitle').textContent=show?(n===4?'잠시 후 출항합니다':'다른 플레이어를 찾고 있어요…'):'';document.querySelector('.notice').textContent=show?'4명이 모이면 게임을 시작합니다':'';document.querySelector('.divider').style.display=show?'none':'block';const button=document.querySelector('.cancel');button.textContent=show?'매칭 취소':'';const state=$('buttonState').value;button.disabled=state==='disabled';button.style.backgroundImage=`url(match-button-${state}.png)`;document.querySelector('.spinner').style.display=n===4?'none':'block'}
document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',update));document.querySelector('.cancel').onclick=()=>{};
const assets=['harbour-background','match-panel','slot-occupied-background','slot-empty-background','slot-frame','slot-local-highlight','slot-nameplate-light','slot-nameplate-dark','match-button-normal','match-button-pressed','match-button-disabled','loading-spinner','notice-divider','slot-waiting-silhouette','slot-question-mark'];assets.forEach((n,i)=>{const d=document.createElement('div');d.className='tile';d.innerHTML=`<div class="checker"><img src="${n}.png"></div><a href="${n}.png" download>${n}.png</a>`+(i>1&&n!=='slot-waiting-silhouette'?`<a href="${n}.svg" download>SVG 원본</a>`:'');$('assets').append(d)});const params=new URLSearchParams(location.search);if(params.has('capture'))document.body.classList.add('capture');if(params.has('sample'))document.getElementById('sampleText').checked=true;if(params.has('count'))document.getElementById('count').value=Math.max(0,Math.min(4,Number(params.get('count'))||0));update();
</script></html>
