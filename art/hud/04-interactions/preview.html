<!doctype html><html lang="ko"><meta charset="utf-8"><title>HUD 04 · Interactions</title>
<style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#193340;color:#f3f5ef;font:16px system-ui,sans-serif}h1{font-size:25px}p{color:#b8ced6}.stage{display:flex;align-items:center;flex-wrap:wrap;gap:80px;background:linear-gradient(120deg,#365865,#1b3441);padding:40px;border-radius:16px;margin:28px 0}.task{width:230px}.circle{position:relative;aspect-ratio:1}.layer{position:absolute;inset:0;width:100%;height:100%}.glyph{position:absolute;inset:25%;width:50%;height:50%;object-fit:contain}.label{height:57.5px;background:url(task-label.png) center/100% 100% no-repeat;display:grid;place-items:center;font-size:21px;font-weight:800;margin-top:10px}.worlds{display:flex;flex-wrap:wrap;gap:24px}.world{width:110px}.world .glyph{inset:21%;width:58%;height:58%}.world p{text-align:center;font-size:13px}.controls{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:24px}label{display:grid;gap:8px}select,input,button{padding:8px;border:1px solid #6d8796;border-radius:5px;background:#284656;color:white}.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:16px}.tile{padding:12px;background:#254451;border-radius:10px}.checker{height:160px;display:grid;place-items:center;background:repeating-conic-gradient(#607780 0% 25%,#8a9da4 0% 50%) 0/20px 20px}.checker img{max-width:100%;max-height:145px}.tile a{display:block;color:#d0f2ff;font-size:13px;margin-top:10px;overflow-wrap:anywhere}</style>
<h1>04 · 현재 작업 / 월드 상호작용</h1><p>같은 아이콘을 작업 표시와 월드 빌보드에서 재사용합니다. 진행률은 12시에서 시계 방향으로 채워집니다.</p>
<div class="controls"><label>현재 작업<select id="kind"><option value="repair">수리</option><option value="sails">돛</option><option value="helm">조타</option><option value="cannon">대포</option></select></label><label>진행률 <output id="value">65%</output><input id="amount" type="range" min="0" max="100" value="65"></label><label>월드 선택 강조<input id="focus" type="checkbox" checked></label><label>월드 원형 배경<input id="backdrop" type="checkbox" checked></label><button id="play">작업 진행 재생</button></div>
<div class="stage"><div class="task"><div class="circle"><img class="layer" src="task-background.png"><img class="layer" src="task-progress-track.png"><img id="fill" class="layer" src="task-progress-fill.png"><img class="layer" src="task-frame.png"><img id="taskIcon" class="glyph" src="icon-repair.png"></div><div id="taskLabel" class="label">REPAIRING</div></div><div class="worlds" id="worlds"></div></div>
<h2>개별 PNG · 12종</h2><div class="assets" id="assets"></div>
<script>
const names=['repair','sails','helm','cannon'],labels=['REPAIRING','TRIMMING SAILS','STEERING','LOADING'];names.forEach(n=>{const d=document.createElement('div');d.className='world';d.dataset.kind=n;d.innerHTML=`<div class="circle"><img class="layer back" src="world-background.png"><img class="layer" src="world-ring.png"><img class="layer focus" src="world-focus-ring.png"><img class="glyph" src="icon-${n}.png"></div><p>${n.toUpperCase()}</p>`;document.getElementById('worlds').append(d)});
const $=id=>document.getElementById(id);function update(){const p=+$('amount').value,kind=$('kind').value,fill=$('fill');fill.style.maskImage=`conic-gradient(#000 ${p*3.6}deg, transparent 0deg)`;fill.style.webkitMaskImage=fill.style.maskImage;fill.style.display=p===0?'none':'block';$('value').textContent=p+'%';$('taskIcon').src=`icon-${kind}.png`;$('taskLabel').textContent=labels[names.indexOf(kind)];document.querySelectorAll('.world').forEach(w=>{w.querySelector('.focus').style.display=$('focus').checked&&w.dataset.kind===kind?'block':'none';w.querySelector('.back').style.display=$('backdrop').checked?'block':'none'})}document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',update));let timer=null;$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='작업 진행 재생';return}if(+$('amount').value===100)$('amount').value=0;$('play').textContent='일시 정지';timer=setInterval(()=>{$('amount').value=Math.min(100,+$('amount').value+1);update();if(+$('amount').value===100){clearInterval(timer);timer=null;$('play').textContent='작업 진행 재생'}},70)};
const assets=['task-background','task-frame','task-progress-track','task-progress-fill','task-label','world-background','world-ring','world-focus-ring',...names.map(n=>'icon-'+n)];assets.forEach(n=>{const d=document.createElement('div');d.className='tile';d.innerHTML=`<div class="checker"><img src="${n}.png"></div><a href="${n}.png" download>${n}.png</a><a href="${n}.svg" download>SVG 원본</a>`;$('assets').append(d)});update();
</script></html>
