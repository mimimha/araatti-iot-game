<!doctype html><html lang="ko"><meta charset="utf-8"><title>ShipCoop HUD — 컴포넌트 조합</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08131e;color:#fff2d9;font-family:'Malgun Gothic',sans-serif}header{padding:16px 24px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}header small{color:#9db5c3}label{font-size:13px}input{vertical-align:middle;width:110px}#view{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden}#hud{position:absolute;width:1920px;height:1080px;transform-origin:top left;background:radial-gradient(ellipse at 52% 48%,#277078,#123845 65%,#102a37)}.note{position:absolute;left:600px;top:440px;width:720px;text-align:center;color:#85b0b9;font-size:26px;line-height:1.7}.panel{position:absolute;background-size:100% 100%;padding:14px 22px}.frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.contents{position:relative;z-index:1}.row{display:flex;align-items:center;gap:18px}.icon{width:48px;height:48px;object-fit:contain}strong{font-size:28px}.track{height:20px;background:#152d3e;border:2px solid #9dafba;border-radius:15px;position:relative;overflow:visible}.fill{height:100%;border-radius:12px;background:#48d889}.small{font-size:20px}.event{width:410px;height:104px}.event .icon{width:64px;height:64px}.event strong{font-size:26px}.event p{margin:6px 0;font-size:19px}.event time{margin-left:auto;font-size:27px;color:#ffba55}.event .row{gap:15px}.portraits{display:flex;gap:16px}.portrait{width:120px;text-align:center;font-size:21px}.face{position:relative;width:120px;height:120px;background:#142f40;border-radius:20px;overflow:hidden}.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.portrait b{display:block;margin-top:6px}#ring{width:160px;height:160px;position:relative;flex:none}#ring img{position:absolute;inset:0;width:100%;height:100%}#ring .icon{inset:42px;width:76px;height:76px}#ringfill{background:#ffd05d;mask:url(sprites/ring-fill-white.png) center/contain no-repeat;position:absolute;inset:0;clip-path:inset(0)}kbd{display:inline-block;background:#fff2d9;color:#122538;padding:3px 10px;border-radius:7px;font-size:23px}#delay{position:absolute;height:100%;background:#ef5966;top:0}#ship{position:absolute;top:-20px;width:46px;height:46px;transform:translateX(-50%)}#marker{position:absolute;top:-15px;width:12px;height:46px;transform:translateX(-50%)}
</style>
<header><b>HUD 컴포넌트 조합 예시</b><small>게임 연결 전 / 아래 값은 미리보기용</small>
<label>HP <input id="hp" type="range" min="0" max="100" value="72"></label>
<label>진행 <input id="progress" type="range" min="0" max="100" value="48"></label>
<label>침수 <input id="water" type="range" min="0" max="100" value="35"></label>
<label>수리 <input id="repair" type="range" min="0" max="5" value="3"></label></header>
<div id="view"><div id="hud"><div class="note">게임 화면 영역<br><small>갑판과 캐릭터가 보일 공간입니다.</small></div></div></div>
<script>
const hud=document.querySelector('#hud');
function panel(x,y,w,h,name,html,frame=name+'-frame') {const el=document.createElement('section');el.className='panel';el.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;background-image:url(sprites/${name}-background.png)`;el.innerHTML=`<img class="frame" src="sprites/${frame}.png"><div class="contents">${html}</div>`;hud.append(el);return el}
const icon=n=>`<img class="icon" src="sprites/icon-${n}.png">`;
panel(28,24,180,56,'panel-capsule','<b style="font-size:22px">페이즈 2</b>');
panel(600,24,520,64,'panel-capsule',`<div class="row">${icon('ship')}<b style="white-space:nowrap">배 HP</b><div class="track" style="width:240px"><div class="fill" id="hpfill"></div></div><b id="hpvalue"></b></div>`);
panel(1136,24,184,64,'panel-capsule',`<div class="row">${icon('clock')}<strong>2:14</strong></div>`);
panel(600,102,720,92,'panel-capsule',`<div class="row" style="margin-bottom:16px"><b id="progressvalue">항해 48%</b><span style="margin-left:auto;color:#ffd05d">지금 있어야 할 위치 55%</span></div><div class="track"><div class="fill" id="progressfill" style="background:#64c9f1"></div><div id="delay"></div><img id="ship" src="sprites/icon-ship.png"><img id="marker" src="sprites/voyage-reference.png"></div>`);
panel(795,202,330,42,'panel-capsule','<b id="behind" style="color:#ff7078">이 속도면 늦는다!</b>');
[['reef','암초 예고','조타로 피할 준비!','4초','warning'],['enemy-ship','적선 접근','포탄을 싣고 발사!','12초','danger'],['hull-breach','선체 파손','자재를 가져와 수리!','','danger']].forEach((a,i)=>{let el=panel(28,116+i*116,410,104,'panel-event',`<div class="row">${icon(a[0])}<div><strong style="color:${i?'#ff5864':'#ffbc55'}">${a[1]}</strong><p>${a[2]}</p></div><time>${a[3]}</time></div>`,'event-frame-'+a[4]);el.classList.add('event')});
panel(28,876,570,176,'panel-team',`<div class="portraits">${[['red','captain','수리'],['yellow','diver','운반'],['green','jester','배수'],['purple','wig','돛']].map((p,i)=>`<div class="portrait"><div class="face"><img src="sprites/portrait-${p[1]}.png"><img src="sprites/portrait-frame-${p[0]}.png"></div><b>${i+1}P ${p[2]}</b></div>`).join('')}</div>`);
let flood=panel(680,958,560,94,'panel-flood',`<div class="row">${icon('bucket')}<div style="width:180px"><b id="watervalue"></b><div class="track" style="margin-top:10px"><div class="fill" id="waterfill" style="background:#53baed"></div></div></div><div><b>구멍부터 수리!</b><p style="margin:8px 0" id="damage"></p></div></div>`);
panel(1510,872,382,180,'panel-action',`<div class="row"><div id="ring"><img src="sprites/ring-background.png"><img src="sprites/ring-track.png"><div id="ringfill"></div><img src="sprites/ring-frame.png">${icon('repair')}</div><div><strong>수리 중</strong><p id="repairvalue" style="font-size:30px;margin:10px 0;color:#ffd05d"></p><kbd>F</kbd> 연타</div></div>`);
function update(){let h=+hp.value,p=+progress.value,w=+water.value,r=+repair.value;document.querySelector('#hpfill').style.width=h+'%';document.querySelector('#hpvalue').textContent=h+'/100';document.querySelector('#progressvalue').textContent='항해 '+p+'%';document.querySelector('#progressfill').style.width=p+'%';document.querySelector('#ship').style.left=p+'%';document.querySelector('#marker').style.left='55%';document.querySelector('#delay').style.left=p+'%';document.querySelector('#delay').style.width=Math.max(0,55-p)+'%';document.querySelector('#behind').style.visibility=p<55?'visible':'hidden';flood.style.display=w?'block':'none';document.querySelector('#watervalue').textContent='침수 '+w+'%';document.querySelector('#waterfill').style.width=w+'%';document.querySelector('#damage').textContent='초당 -'+(w*.06).toFixed(1)+' HP';document.querySelector('#repairvalue').textContent=r+'/5';document.querySelector('#ringfill').style.background=`conic-gradient(#ffd05d ${r/5*360}deg, transparent 0deg)`}
document.querySelectorAll('input').forEach(e=>e.addEventListener('input',update));function resize(){hud.style.transform=`scale(${document.querySelector('#view').clientWidth/1920})`}addEventListener('resize',resize);update();resize();
</script></html>
