<!doctype html><html lang="ko"><meta charset="utf-8"><title>HUD 02 · Ship / Voyage</title>
<style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#142530;color:#f3f6f4;font:16px system-ui,sans-serif}h1{font-size:24px}p{color:#bacbd4}.stage{background:linear-gradient(145deg,#315361,#172e3c);border-radius:16px;overflow:hidden}.stage svg{display:block;width:100%}svg text{fill:#fff;font-family:system-ui,sans-serif;font-weight:800;paint-order:stroke;stroke:#101a20;stroke-width:3px}.controls{display:flex;flex-wrap:wrap;gap:24px;padding:24px 0}label{display:grid;gap:8px}input{width:190px}button{padding:9px;background:#365261;color:white;border:1px solid #718b98;border-radius:6px}.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.tile{padding:12px;background:#243c49;border-radius:8px}.checker{height:140px;display:grid;place-items:center;background:repeating-conic-gradient(#526672 0% 25%,#748993 0% 50%) 0/20px 20px}.checker img{max-width:100%;max-height:120px}.tile a{display:block;color:#c5edff;font-size:13px;margin-top:10px;overflow-wrap:anywhere}</style>
<h1>02 · 배 HP / 항해</h1><p>텍스트·위치·채움 비율은 실시간 값입니다. 아래 슬라이더로 빈 상태, 가득 찬 상태, 지연·앞선 상태를 확인할 수 있습니다.</p>
<div class="stage"><svg viewBox="0 0 1400 490" aria-label="동적 HUD 조합 미리보기">
<defs><clipPath id="hpClip"><rect id="hpClipRect" x="12" y="12" width="750" height="72"/></clipPath></defs>
<image href="heading-label.png" x="535" y="14" width="220" height="66"/><text x="645" y="57" text-anchor="middle" font-size="32">SHIP HP</text>
<g transform="translate(190 84)"><image href="hp-track.png" width="1024" height="96"/><image href="hp-fill-green.png" x="12" y="12" width="1000" height="72" clip-path="url(#hpClip)"/><image href="hp-frame.png" width="1024" height="96"/></g>
<image href="icon-ship.png" x="95" y="50" width="135" height="135"/>
<text x="192" y="237" font-size="28">VOYAGE</text>
<g transform="translate(190 270)"><image href="voyage-track.png" width="1024" height="64"/><image id="delay" href="voyage-delay-fill.png" x="365.6" y="16" width="292.8" height="32" preserveAspectRatio="none"/><image href="voyage-frame.png" width="1024" height="64"/><image id="marker" href="voyage-reference-marker.png" x="642.4" y="-24" width="32" height="112"/><image id="ship" href="icon-ship.png" x="313.6" y="-48" width="104" height="104"/></g>
<image href="icon-harbour.png" x="80" y="234" width="110" height="110"/><image href="icon-island.png" x="1220" y="226" width="125" height="125"/>
<image href="timer-label.png" x="1200" y="355" width="170" height="51"/><text id="timeText" x="1285" y="391" text-anchor="middle" font-size="32">3:42</text>
<image href="icon-speed.png" x="190" y="381" width="70" height="70"/><image href="speed-label.png" x="269" y="390" width="215" height="64.5"/><text id="speedText" x="376" y="434" text-anchor="middle" font-size="30">8.5 kn</text>
<text id="statusText" x="700" y="435" text-anchor="middle" font-size="23">BEHIND SCHEDULE</text>
</svg></div>
<div class="controls"><label>배 HP <output id="hpOut"></output><input id="hp" type="range" min="0" max="100" value="75"></label><label>배 위치 <output id="progressOut"></output><input id="progress" type="range" min="0" max="100" value="35"></label><label>예정 기준선 <output id="referenceOut"></output><input id="reference" type="range" min="0" max="100" value="65"></label><label>속도 (표시 단위 예시: kn)<input id="speed" type="range" min="0" max="20" step="0.1" value="8.5"></label><label>남은 시간 (초)<input id="time" type="range" min="0" max="600" value="222"></label></div>
<div class="controls"><button data-preset="empty">HP 0 / 출발</button><button data-preset="late">지연 상태</button><button data-preset="ahead">기준선보다 앞섬</button><button data-preset="done">HP 100 / 도착</button></div>
<h2>개별 투명 PNG · 15종</h2><div class="assets" id="assets"></div>
<script>
const $=id=>document.getElementById(id);
function update(){const hp=+$('hp').value,p=+$('progress').value/100,r=+$('reference').value/100;const shipX=24+976*p,referenceX=24+976*r;$('hpClipRect').setAttribute('width',1000*hp/100);$('ship').setAttribute('x',shipX-52);$('marker').setAttribute('x',referenceX-16);$('delay').setAttribute('x',shipX);$('delay').setAttribute('width',Math.max(0,referenceX-shipX));$('delay').style.display=r>p?'':'none';for(const id of ['hp','progress','reference'])$(id+'Out').textContent=$(id).value+'%';$('speedText').textContent=(+$('speed').value).toFixed(1)+' kn';const t=+$('time').value;$('timeText').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');$('statusText').textContent=p<r?'BEHIND SCHEDULE':p>r?'AHEAD OF SCHEDULE':'ON SCHEDULE'}
document.querySelectorAll('input').forEach(e=>e.addEventListener('input',update));const presets={empty:[0,0,0],late:[75,35,65],ahead:[60,80,55],done:[100,100,100]};document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const v=presets[b.dataset.preset];['hp','progress','reference'].forEach((id,i)=>$(id).value=v[i]);update()});update();
const names=['hp-frame','hp-track','hp-fill-green','hp-mask','voyage-frame','voyage-track','voyage-delay-fill','voyage-reference-marker','icon-ship','icon-harbour','icon-island','icon-speed','timer-label','speed-label','heading-label'];names.forEach(n=>{const d=document.createElement('div');d.className='tile';d.innerHTML=`<div class="checker"><img src="${n}.png"></div><a href="${n}.png" download>${n}.png</a><a href="${n}.svg" download>SVG 원본</a>`;$('assets').append(d)});
</script></html>
