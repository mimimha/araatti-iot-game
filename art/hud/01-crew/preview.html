<!doctype html><html lang="ko"><meta charset="utf-8"><title>HUD 01 · Crew assets</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:40px;background:#15242e;color:#edf4f6;font:16px system-ui,sans-serif}h1{font-size:24px}p{color:#b6c7ce}.crew{display:flex;gap:22px;margin:30px 0 50px;flex-wrap:wrap}.player{width:144px}.portrait{position:relative;width:144px;height:144px}.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.portrait .face{inset:9%;width:82%;height:82%}.label{height:40px;display:grid;place-items:center;background:url('role-label.png') center/100% 100% no-repeat;font-weight:800}select{margin-top:12px;width:100%;padding:6px;color:white;background:#253e4d;border:1px solid #667b88;border-radius:4px}.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:16px}.tile{padding:12px;background:#21333f;border-radius:10px}.checker{height:170px;display:grid;place-items:center;background:repeating-conic-gradient(#71828b 0% 25%,#536570 0% 50%) 0/20px 20px;border-radius:6px}.checker img{max-width:100%;max-height:160px}.tile a{display:block;color:#bfe9ff;margin-top:12px;font-size:13px;overflow-wrap:anywhere}
</style><h1>01 · 프로필 / 역할 라벨</h1><p>얼굴, 플레이어 색, 역할명을 독립적으로 바꾸는 조합 미리보기입니다. 역할명은 PNG에 포함되지 않습니다.</p><div class="crew" id="crew"></div><h2>개별 투명 PNG</h2><div class="assets" id="assets"></div>
<script>
const faces=['diver','wig','captain','jester'],colors=['green','red','yellow','purple'],roles=['REPAIR','SAILS','HELM','CANNON'];
faces.forEach((f,i)=>{const p=document.createElement('div');p.className='player';p.innerHTML=`<div class="portrait"><img src="portrait-backplate.png"><img class="face" src="portrait-${f}.png"><img class="frame" src="frame-${colors[i]}.png"></div><div class="label">${roles[i]}</div><select aria-label="역할">${roles.map(r=>`<option ${r===roles[i]?'selected':''}>${r}</option>`).join('')}</select><select aria-label="테두리 색">${colors.map(c=>`<option ${c===colors[i]?'selected':''}>${c}</option>`).join('')}</select>`;p.querySelectorAll('select')[0].onchange=e=>p.querySelector('.label').textContent=e.target.value;p.querySelectorAll('select')[1].onchange=e=>p.querySelector('.frame').src=`frame-${e.target.value}.png`;document.querySelector('#crew').append(p)});
[...faces.map(f=>`portrait-${f}`),...colors.map(c=>`frame-${c}`),'portrait-backplate','role-label'].forEach(n=>{const d=document.createElement('div');d.className='tile';d.innerHTML=`<div class="checker"><img src="${n}.png"></div><a href="${n}.png" download>${n}.png</a>`;document.querySelector('#assets').append(d)});
</script></html>
